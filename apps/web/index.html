<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)" />
    <title>Pokémon Daily</title>
    <meta
      name="description"
      content="A new OU battle every day, in Gens 3 to 6. Build a team each week, then win on your first try to keep your streak. Or play live with friends."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- A new file name whenever the icon changes: iOS keeps an icon by its URL. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews. %VITE_SITE_URL% is the deployed origin (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pokémon Daily" />
    <meta property="og:title" content="Pokémon Daily" />
    <meta
      property="og:description"
      content="A new OU battle every day, in Gens 3 to 6. Build a team each week, then win on your first try to keep your streak. Or play live with friends."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
