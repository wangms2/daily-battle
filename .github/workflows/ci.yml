name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # poke-engine (Rust) compiled to WebAssembly, one module per gen, for the Hard
  # AI. Built once and shared: tests, the web build, and the room server use it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine-wasm/rust
      - run: pnpm --filter @daily-battle/engine-wasm build:wasm
      - uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine-wasm/dist
          retention-days: 1

  # Lint, types, unit tests, and the production build (shared with e2e).
  check:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine-wasm/dist
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build
        env:
          VITE_SITE_URL: https://battle.peanutbuilds.com
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # Long-running simulations, in parallel with everything else.
  sims:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine-wasm/dist
      - run: pnpm --filter @daily-battle/sim-bridge soak --n 1000
      - run: pnpm --filter @daily-battle/gen check --n 10000
      - run: pnpm --filter @daily-battle/ai eval --n 100 --assert
      # Hard at a small budget: a smoke test that it plays whole battles (win
      # rates are reported, not asserted; tuning runs are local, at full budget).
      - run: pnpm --filter @daily-battle/ai eval --hard --only-hard --hard-n 10 --hard-iterations 20000
      # The coach's warnings (docs/plan-tutorial-coach.md, step 4): a smoke test
      # that collecting shown warnings and rolling them out works end to end.
      # Gains are reported, not asserted (too few cases); the full run is local.
      - run: pnpm --filter @daily-battle/tutorial coach-eval --shown --battles 20 --cases 30 --r 6 --jobs 2

  # Playwright on the shared build, split across shards.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine-wasm/dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_PREBUILT: '1'

  # Deploy the tested build and the room server to Cloudflare
  # (battle.peanutbuilds.com) on pushes to main. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets;
  # skipped until they're set.
  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The room server (apps/server) is bundled from source, with the pinned wrangler
      # and the engine modules (the Hard Rival).
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine-wasm/dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy with Wrangler
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; skipping deploy."
            exit 0
          fi
          # The stats database's migrations (apps/server/migrations). The token needs
          # D1 Edit; without it this warns, and migrations are applied by hand
          # (wrangler d1 migrations apply DB --remote).
          pnpm exec wrangler d1 migrations apply DB --remote ||
            echo "::warning::Couldn't apply D1 migrations (does the token have D1 Edit?)"
          pnpm exec wrangler deploy
